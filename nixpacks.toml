[providers]
providers = ["python", "node"]

[phases.setup]
nixPkgs = ["python310", "nodejs-20_x"]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "cd frontend && npm ci"
]

[phases.build]
cmds = [
    "cd frontend && npm run build"
]

[start]
cmd = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
